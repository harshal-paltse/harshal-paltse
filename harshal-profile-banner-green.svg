<svg width="900" height="160" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%"  style="stop-color:#0a2e1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1a4a2a" stroke-width="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="160" fill="url(#bgGrad)" rx="12"/>
  <rect width="900" height="160" fill="url(#grid)" rx="12" opacity="0.4"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="5" height="160" fill="#39d353" rx="2"/>

  <!-- Top / bottom lines -->
  <line x1="20" y1="12"  x2="880" y2="12"  stroke="#39d353" stroke-width="0.6" opacity="0.4"/>
  <line x1="20" y1="148" x2="880" y2="148" stroke="#39d353" stroke-width="0.6" opacity="0.4"/>

  <!-- Corner brackets -->
  <path d="M 20 25 L 20 15 L 30 15"  fill="none" stroke="#39d353" stroke-width="1.5"/>
  <path d="M 880 25 L 880 15 L 870 15" fill="none" stroke="#39d353" stroke-width="1.5"/>
  <path d="M 20 135 L 20 145 L 30 145" fill="none" stroke="#39d353" stroke-width="1.5"/>
  <path d="M 880 135 L 880 145 L 870 145" fill="none" stroke="#39d353" stroke-width="1.5"/>

  <!-- Animated pulse dots -->
  <circle cx="850" cy="30" r="3" fill="#39d353" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="838" cy="30" r="2" fill="#39d353" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="828" cy="30" r="1.5" fill="#39d353" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.05;0.3" dur="2s" begin="0.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Name -->
  <text x="45" y="72"
        font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif"
        font-size="38" font-weight="700" fill="#ffffff"
        filter="url(#glow)" letter-spacing="1">Harshal Paltse</text>

  <!-- Green underline -->
  <rect x="45" y="78" width="260" height="2" fill="#39d353" rx="1" opacity="0.9"/>

  <!-- Tagline -->
  <text x="45" y="105"
        font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif"
        font-size="15" font-weight="400" fill="#8b949e" letter-spacing="0.3">AI &amp; ML Engineer  •  Full-Stack Developer  •  8× National Hackathon Winner</text>

  <!-- Tech pills -->
  <rect x="45"  y="120" width="62" height="22" rx="11" fill="#1a4a2a" stroke="#39d353" stroke-width="0.8"/>
  <text x="76"  y="135" text-anchor="middle" font-family="'Segoe UI',monospace,sans-serif" font-size="11" font-weight="600" fill="#39d353">Python</text>

  <rect x="115" y="120" width="62" height="22" rx="11" fill="#1a4a2a" stroke="#39d353" stroke-width="0.8"/>
  <text x="146" y="135" text-anchor="middle" font-family="'Segoe UI',monospace,sans-serif" font-size="11" font-weight="600" fill="#39d353">FastAPI</text>

  <rect x="185" y="120" width="55" height="22" rx="11" fill="#1a3a4a" stroke="#58a6ff" stroke-width="0.8"/>
  <text x="212" y="135" text-anchor="middle" font-family="'Segoe UI',monospace,sans-serif" font-size="11" font-weight="600" fill="#58a6ff">React</text>

  <rect x="248" y="120" width="72" height="22" rx="11" fill="#2a1a4a" stroke="#bc8cff" stroke-width="0.8"/>
  <text x="284" y="135" text-anchor="middle" font-family="'Segoe UI',monospace,sans-serif" font-size="11" font-weight="600" fill="#bc8cff">ML / AI</text>

  <rect x="328" y="120" width="58" height="22" rx="11" fill="#1a3a4a" stroke="#58a6ff" stroke-width="0.8"/>
  <text x="357" y="135" text-anchor="middle" font-family="'Segoe UI',monospace,sans-serif" font-size="11" font-weight="600" fill="#58a6ff">Docker</text>

  <!-- Decorative bar chart (right side) -->
  <g transform="translate(640,35)" opacity="0.7">
    <text x="0" y="0" font-family="monospace" font-size="9" fill="#39d353" opacity="0.6">contributions</text>
    <rect x="0"   y="60" width="8" height="20" rx="2" fill="#39d353" opacity="0.3"/>
    <rect x="12"  y="45" width="8" height="35" rx="2" fill="#39d353" opacity="0.5"/>
    <rect x="24"  y="50" width="8" height="30" rx="2" fill="#39d353" opacity="0.4"/>
    <rect x="36"  y="30" width="8" height="50" rx="2" fill="#39d353" opacity="0.7"/>
    <rect x="48"  y="40" width="8" height="40" rx="2" fill="#39d353" opacity="0.6"/>
    <rect x="60"  y="20" width="8" height="60" rx="2" fill="#39d353" opacity="0.9"/>
    <rect x="72"  y="35" width="8" height="45" rx="2" fill="#39d353" opacity="0.7"/>
    <rect x="84"  y="25" width="8" height="55" rx="2" fill="#39d353" opacity="0.85"/>
    <rect x="96"  y="15" width="8" height="65" rx="2" fill="#39d353" opacity="1.0"/>
    <rect x="108" y="30" width="8" height="50" rx="2" fill="#26a641" opacity="0.8"/>
    <rect x="120" y="10" width="8" height="70" rx="2" fill="#39d353" opacity="1.0"/>
    <rect x="132" y="20" width="8" height="60" rx="2" fill="#26a641" opacity="0.9"/>
    <line x1="0" y1="81" x2="145" y2="81" stroke="#39d353" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- GitHub handle -->
  <text x="858" y="145" text-anchor="end"
        font-family="'Segoe UI',monospace,sans-serif"
        font-size="11" fill="#39d353" opacity="0.7">github.com/harshal-paltse</text>
</svg>
