<svg width="1500" height="500" viewBox="0 0 1500 500" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#070a08"/>
      <stop offset="50%" stop-color="#0b1712"/>
      <stop offset="78%" stop-color="#0f2a1c"/>
      <stop offset="100%" stop-color="#1ea34e"/>
    </linearGradient>
    <linearGradient id="rightBlock" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1ea34e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2ee673" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8affab"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <pattern id="dotgrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.3" fill="#2ee673" opacity="0.16"/>
    </pattern>
    <mask id="fadeMaskH">
      <rect x="0" y="0" width="900" height="500" fill="url(#fadeGrad)"/>
    </mask>
    <linearGradient id="fadeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1500" height="500"/></clipPath>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111e17"/>
      <stop offset="100%" stop-color="#0a1510"/>
    </linearGradient>
    <filter id="termShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <radialGradient id="cornerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2ee673" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2ee673" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#frame)">
    <!-- base background -->
    <rect width="1500" height="500" fill="url(#bgGrad)"/>

    <!-- left thin accent bar -->
    <rect x="0" y="0" width="12" height="500" fill="#2ee673"/>
    <rect x="12" y="0" width="72" height="500" fill="#070a08"/>
    <rect x="58" y="0" width="4" height="500" fill="#2ee673" opacity="0.55"/>

    <!-- dot-grid texture, fading left half -->
    <rect x="0" y="0" width="900" height="500" fill="url(#dotgrid)" mask="url(#fadeMaskH)"/>

    <!-- ghost outline big letters, background -->
    <g font-family="Arial Black, Arial, sans-serif" font-weight="900" fill="none" stroke="#1f4a30" stroke-width="1.3" opacity="0.45">
      <text x="18" y="330" font-size="270">H</text>
      <text x="188" y="330" font-size="270">P</text>
    </g>

    <!-- full name -->
    <text x="95" y="140" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="46" fill="url(#nameGrad)" letter-spacing="2">HARSHAL PALTSE</text>
    <rect x="97" y="155" width="340" height="4" fill="#2ee673"/>

    <!-- subtitle roles -->
    <text x="95" y="200" font-family="Segoe UI, Verdana, sans-serif" font-size="23" font-weight="700" fill="#eafff2" letter-spacing="1.5">Software Engineer <tspan fill="#2ee673">·</tspan> AI Engineer</text>

    <!-- full quote -->
    <text x="95" y="243" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#bfeccf" opacity="0.95">"Talk is cheap. Show me the code."</text>
    <text x="95" y="267" font-family="Georgia, serif" font-size="15" fill="#7bc496" opacity="0.85">— Linus Torvalds</text>

    <!-- achievements row -->
    <g font-family="Segoe UI, Verdana, sans-serif" font-size="14.5" fill="#06130a" font-weight="700">
      <rect x="95" y="287" width="210" height="34" rx="17" fill="#2ee673"/>
      <text x="200" y="309" text-anchor="middle">🏆 8x Hackathon Winner</text>

      <rect x="315" y="287" width="222" height="34" rx="17" fill="#2ee673"/>
      <text x="426" y="309" text-anchor="middle">🌱 Open Source Contributor</text>

      <rect x="95" y="329" width="246" height="34" rx="17" fill="#0d1f16" stroke="#2ee673" stroke-width="1.4"/>
      <text x="218" y="351" text-anchor="middle" fill="#bfeccf">🌍 Intl. Finalist, Kazakhstan</text>
    </g>

    <!-- divider -->
    <line x1="95" y1="380" x2="590" y2="380" stroke="#1b3626" stroke-width="1"/>

    <!-- contact details -->
    <g font-family="Segoe UI, Verdana, sans-serif" font-size="14.5" fill="#cdf5db">
      <text x="95" y="408">✉️&#160;&#160; harshalpaltse@gmail.com</text>
      <text x="95" y="434">📱&#160;&#160; +91 93599 47410</text>
    </g>

    <!-- LinkedIn badge (clickable) -->
    <a xlink:href="https://www.linkedin.com/in/harshal-paltse/" target="_blank">
      <rect x="93" y="449" width="212" height="34" rx="7" fill="#0A66C2"/>
      <g transform="translate(104,457)">
        <rect x="0" y="0" width="18" height="18" rx="3" fill="#ffffff"/>
        <rect x="3" y="7" width="3.5" height="8" fill="#0A66C2"/>
        <circle cx="4.7" cy="4" r="2" fill="#0A66C2"/>
        <path d="M9,7 h3.2 v1.6 c0.6,-1.1 1.9,-1.9 3.4,-1.9 c2.6,0 3.4,1.6 3.4,4 v4.3 h-3.4 v-3.8 c0,-1 -0.4,-1.7 -1.3,-1.7 c-0.9,0 -1.5,0.6 -1.5,1.8 v3.7 h-3.4 z" fill="#0A66C2"/>
      </g>
      <text x="134" y="471" font-family="Segoe UI, Verdana, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff">Harshal Paltse</text>
    </a>

    <!-- Terminal / editor style panel -->
    <g transform="translate(716,74)" filter="url(#termShadow)">
      <rect x="0" y="0" width="566" height="352" rx="12" fill="url(#termGrad)" stroke="#2ee673" stroke-width="1.4"/>
      <!-- title bar -->
      <rect x="0" y="0" width="566" height="36" rx="12" fill="#0c1a12"/>
      <rect x="0" y="24" width="566" height="12" fill="#0c1a12"/>
      <circle cx="24" cy="18" r="5.5" fill="#ff5f57"/>
      <circle cx="45" cy="18" r="5.5" fill="#febc2e"/>
      <circle cx="66" cy="18" r="5.5" fill="#28c840"/>
      <text x="296" y="23" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#7bc496" text-anchor="middle" opacity="0.85">harshal.dev — profile.js</text>

      <!-- line-number gutter -->
      <rect x="0" y="36" width="40" height="316" fill="#0b170f"/>
      <g font-family="Consolas, Menlo, monospace" font-size="14" fill="#2b5a3e" text-anchor="end">
        <text x="30" y="66">1</text>
        <text x="30" y="92">2</text>
        <text x="30" y="118">3</text>
        <text x="30" y="144">4</text>
        <text x="30" y="170">5</text>
        <text x="30" y="196">6</text>
        <text x="30" y="222">7</text>
        <text x="30" y="248">8</text>
        <text x="30" y="274">9</text>
        <text x="30" y="300">10</text>
        <text x="30" y="326">11</text>
      </g>

      <!-- syntax-highlighted code -->
      <g font-family="Consolas, Menlo, monospace" font-size="15">
        <text x="54" y="66"><tspan fill="#7f8ea8">// welcome to my profile</tspan></text>
        <text x="54" y="92"><tspan fill="#c586c0">const</tspan><tspan fill="#eafff2"> developer </tspan><tspan fill="#c586c0">=</tspan><tspan fill="#eafff2"> {</tspan></text>
        <text x="54" y="118"><tspan fill="#eafff2">  name: </tspan><tspan fill="#ce9178">"Harshal Sham Paltse"</tspan><tspan fill="#eafff2">,</tspan></text>
        <text x="54" y="144"><tspan fill="#eafff2">  role: </tspan><tspan fill="#ce9178">"Software &amp; AI Engineer"</tspan><tspan fill="#eafff2">,</tspan></text>
        <text x="54" y="170"><tspan fill="#eafff2">  focus: [</tspan><tspan fill="#ce9178">"AI/ML"</tspan><tspan fill="#eafff2">, </tspan><tspan fill="#ce9178">"Full-Stack"</tspan><tspan fill="#eafff2">],</tspan></text>
        <text x="54" y="196"><tspan fill="#eafff2">  hackathons: </tspan><tspan fill="#b5cea8">8</tspan><tspan fill="#eafff2">,</tspan></text>
        <text x="54" y="222"><tspan fill="#eafff2">  openToWork: </tspan><tspan fill="#569cd6">true</tspan></text>
        <text x="54" y="248"><tspan fill="#eafff2">};</tspan></text>
        <text x="54" y="274"><tspan fill="#c586c0">export default</tspan><tspan fill="#eafff2"> developer;</tspan></text>
        <text x="54" y="308"><tspan fill="#7f8ea8">// building AI that solves</tspan></text>
        <text x="54" y="326"><tspan fill="#7f8ea8">// real-world problems</tspan></text>
      </g>

      <!-- cursor -->
      <rect x="216" y="262" width="9" height="15" fill="#2ee673" opacity="0.9"/>
    </g>

    <!-- right solid green block -->
    <rect x="1280" y="0" width="220" height="500" fill="url(#rightBlock)"/>
    <rect x="1442" y="0" width="58" height="500" fill="#2ee673"/>
    <circle cx="1390" cy="250" r="140" fill="url(#cornerGlow)"/>

    <g fill="#06130a" opacity="0.5">
      <circle cx="1320" cy="60" r="2.2"/>
      <circle cx="1360" cy="60" r="2.2"/>
      <circle cx="1400" cy="60" r="2.2"/>
      <circle cx="1320" cy="160" r="2.2"/>
      <circle cx="1360" cy="160" r="2.2"/>
      <circle cx="1400" cy="160" r="2.2"/>
      <circle cx="1320" cy="260" r="2.2"/>
      <circle cx="1360" cy="260" r="2.2"/>
      <circle cx="1400" cy="260" r="2.2"/>
      <circle cx="1320" cy="360" r="2.2"/>
      <circle cx="1360" cy="360" r="2.2"/>
      <circle cx="1400" cy="360" r="2.2"/>
      <circle cx="1320" cy="440" r="2.2"/>
      <circle cx="1360" cy="440" r="2.2"/>
      <circle cx="1400" cy="440" r="2.2"/>
    </g>
  </g>
</svg>
